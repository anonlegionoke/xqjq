services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: windpulse-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ELEXON_API_BASE_URL=${ELEXON_API_BASE_URL:-https://data.elexon.co.uk/bmrs/api/v1/datasets}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: windpulse-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: windpulse-network
